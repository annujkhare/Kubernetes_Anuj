apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: flask-frontend
          image: flask-frontend:local
          imagePullPolicy: Never
          env:
            - name: EXPRESS_BACKEND_URL
              value: "http://backend:3000"
          ports:
            - containerPort: 5000
