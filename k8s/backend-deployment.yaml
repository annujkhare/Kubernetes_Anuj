apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: express-backend
          image: express-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
