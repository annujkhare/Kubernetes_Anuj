
services:
  backend:
    build: ./backend
    image: annujkhare/flask-backend:latest
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    image: annujkhare/express-frontend:latest
    ports:
      - "3000:3000"
    environment:
      FLASK_URL: http://backend:5000
    depends_on:
      - backend
